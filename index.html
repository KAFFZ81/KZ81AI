<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KZ81 AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b14;color:#f5f5fa;font:15px Arial,sans-serif}.app{max-width:920px;margin:auto;padding:28px 18px;min-height:100vh;display:flex;flex-direction:column}.brand{color:#e6c477;font-weight:800;letter-spacing:2px}.hero{text-align:center;margin:12vh auto 35px}.hero h1{font-size:clamp(38px,7vw,66px);margin:12px 0}.hero h1 span{color:#e6c477}.muted{color:#969db1;line-height:1.6}.chips{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:24px}.chips button,.send{border:1px solid #343951;background:#171b2b;color:#eee;border-radius:10px;padding:11px 14px;cursor:pointer}.chat{flex:1;max-width:780px;width:100%;margin:0 auto}.messages{display:grid;gap:14px;margin-bottom:20px}.msg{white-space:pre-wrap;line-height:1.65;padding:15px 17px;border:1px solid #2b3045;border-radius:13px;background:#131827}.user{border-color:#625132;background:#211e1b}.composer{position:sticky;bottom:0;background:#090b14;padding:12px 0 25px}.composer form{background:#14192a;border:1px solid #3a4057;border-radius:14px;padding:12px;display:flex;gap:10px}.composer textarea{flex:1;min-height:60px;max-height:180px;resize:vertical;background:transparent;border:0;outline:0;color:white;font:inherit}.send{background:#e6c477;color:#17130b;border:0;font-weight:bold}.hint{text-align:center;color:#747d94;font-size:11px;margin-top:10px}
</style>
<div class="app"><div class="brand">✦ KZ81 AI <small style="color:#8991a7;font-weight:400"> / SMART WORKSPACE</small></div><section class="hero" id="hero"><div class="brand">YOUR STUDY & CREATIVE PARTNER</div><h1>Halo, <span>KAFFZ81.</span></h1><p class="muted">Belajar, bertanya, dan kembangkan ide bersama KZ81 AI.</p><div class="chips"><button data-p="Jelaskan materi pelajaran ini dengan sederhana:">Ringkas materi</button><button data-p="Selesaikan soal ini dengan langkah-langkah:">Selesaikan soal</button><button data-p="Buat draft tugas sekolah tentang:">Buat tugas</button><button data-p="Buat 5 soal kuis dari materi ini:">Buat kuis</button></div></section><main class="chat"><div class="messages" id="messages"></div><div class="composer"><form id="form"><textarea id="prompt" placeholder="Tulis pertanyaan untuk KZ81 AI..." required></textarea><button class="send">Kirim ↑</button></form><div class="hint">AI dapat membuat kesalahan. Periksa kembali informasi penting.</div></div></main></div>
<script>
const $=s=>document.querySelector(s), messages=[];function add(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'');d.textContent=text;$('#messages').append(d);$('#hero').style.display='none';d.scrollIntoView({behavior:'smooth',block:'end'})}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('#prompt').value=b.dataset.p;$('#prompt').focus()});
$('#form').onsubmit=async e=>{e.preventDefault();const t=$('#prompt').value.trim();if(!t)return;$('#prompt').value='';messages.push({role:'user',parts:[{text:t}]});add('user',t);const wait=document.createElement('div');wait.className='msg';wait.textContent='KZ81 AI sedang berpikir...';$('#messages').append(wait);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,instruction:'Kamu adalah KZ81 AI, asisten belajar yang ramah dan menjawab dalam bahasa Indonesia. Jelaskan dengan jelas dan bertahap.'})});const j=await r.json();if(!r.ok)throw Error(j.error||'Permintaan gagal');wait.textContent=j.text;messages.push({role:'model',parts:[{text:j.text}]})}catch(err){wait.textContent='Belum bisa menghubungi AI: '+err.message+'. Pastikan binding Workers AI bernama AI sudah ditambahkan di Cloudflare Pages > Settings > Bindings, lalu deploy ulang.'}};
</script></div>
